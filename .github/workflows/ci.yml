name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: macos-latest
    # A hung test fails the run instead of holding a runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build the app (release)
        run: ./build.sh
      - name: Unit tests
        run: swift test
        timeout-minutes: 8
      - name: Unit tests under Thread Sanitizer
        run: swift test --sanitize=thread
        timeout-minutes: 8
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShot.app
          path: build/ScreenShot.app

  integration:
    name: In-app UI tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: UI self-tests (no screen recording on hosted runners, so no --live)
        run: Tools/integration-tests.sh
